<div class="list-card">
  @if (isEmpty()) {
    <div class="empty-state">
      <div class="empty-icon">🛒</div>
      <p class="empty-title">Your list is empty</p>
      <p class="empty-hint">Add your first item below!</p>
    </div>
  } @else {
    <cdk-virtual-scroll-viewport
      class="list-viewport"
      [class.dragging]="drag.active()"
      [itemSize]="ROW_HEIGHT"
      [minBufferPx]="BUFFER_MIN_PX"
      [maxBufferPx]="BUFFER_MAX_PX"
    >
      <div
        class="v-row"
        *cdkVirtualFor="let row of rows(); let i = index; trackBy: trackRow; templateCacheSize: 0"
        [class.drag-hidden]="row.kind === 'item' && drag.isHidden(row.item.id)"
        [style.transform]="drag.shiftFor(i)"
      >
        @switch (row.kind) {
          @case ('done-header') {
            <div class="completed-divider"><span>done ({{ row.count }})</span></div>
          }
          @case ('todo-header') {
            <div class="completed-divider"><span>to do ({{ row.count }})</span></div>
          }
          @default {
            <ion-item-sliding [disabled]="drag.active()">
              <ion-item>
                <ion-checkbox
                  class="text-lg"
                  color="tertiary"
                  labelPlacement="end"
                  alignment="start"
                  [checked]="row.item.checked"
                  (ionChange)="checkItem(row.item.id)"
                  [attr.aria-label]="(row.item.checked ? 'Mark ' + row.item.itemName + ' as incomplete' : 'Mark ' + row.item.itemName + ' as complete')"
                  >&nbsp;</ion-checkbox
                >
                <ion-input
                  enterkeyhint="done"
                  mode="ios"
                  [value]="row.item.itemName"
                  (ionInput)="valueChange(row.item.id, $event)"
                  (ionBlur)="blurItem(row.item.id)"
                  [class.line-through]="row.section === 'done'"
                >
                </ion-input>
                @if (row.section === 'todo') {
                  <!--
                    Reorder handle. pointerdown hands the gesture to RowDragController;
                    touchstart/mousedown are stopped here so ion-item-sliding's swipe
                    gesture never starts from the handle, and the long-press context
                    menu is suppressed so Android doesn't interrupt the drag.
                  -->
                  <ion-icon
                    class="drag-handle"
                    name="reorder-three-outline"
                    slot="end"
                    aria-label="Reorder"
                    (pointerdown)="drag.start($event, i, row.item.id, row.item.itemName)"
                    (touchstart)="$event.stopPropagation()"
                    (mousedown)="$event.stopPropagation()"
                    (contextmenu)="$event.preventDefault()"
                  ></ion-icon>
                }
              </ion-item>
              <ion-item-options side="start">
                <ion-item-option color="danger" (click)="deleteItemWithUndo(row.item)">
                  <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                </ion-item-option>
              </ion-item-options>
            </ion-item-sliding>
          }
        }
      </div>
    </cdk-virtual-scroll-viewport>
  }

  <app-input-container></app-input-container>
</div>
